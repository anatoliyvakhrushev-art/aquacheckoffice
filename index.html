<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaCheckOffice — рабочий вход</title>
<!-- ?v= — метка версии. Без неё браузер (особенно телефон) продолжает крутить старый
     закэшированный app.js/app.css после деплоя: обновления «не появляются», хотя они на сервере.
     Метку нужно менять при каждом изменении app.js или app.css. -->
<link rel="stylesheet" href="app.css?v=20260918-2">
</head>
<body>
<div id="app"></div>

<!-- Библиотека лежит на нашем сервере, а не на стороннем CDN: иначе недоступность
     cdn.jsdelivr.net полностью останавливает сервис на всех точках, хотя сам сервер
     исправен. Версия зафиксирована (2.116.0) — обновление больше не приезжает само. -->
<script src="supabase-js.js?v=2.116.0"></script>
<script src="app.js?v=20260918-2"></script>
</body>
</html>
